<svg width="80" height="80" viewBox="0 0 80 80" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>Icône app distribution flyers</title>
  <desc>Icône carrée style emoji — flyer en vol, tons ambrés</desc>

  <!-- Fond arrondi -->
  <rect width="80" height="80" rx="18" fill="#FAEEDA"/>

  <!-- Flyer principal -->
  <rect x="22" y="20" width="26" height="34" rx="3" fill="none" stroke="#BA7517" stroke-width="2" transform="rotate(-6 35 37)"/>
  <!-- Lignes sur le flyer -->
  <line x1="27" y1="30" x2="41" y2="29" stroke="#EF9F27" stroke-width="1.2" stroke-linecap="round" transform="rotate(-6 35 37)"/>
  <line x1="27" y1="36" x2="41" y2="35" stroke="#EF9F27" stroke-width="1.2" stroke-linecap="round" transform="rotate(-6 35 37)"/>
  <line x1="27" y1="42" x2="37" y2="41" stroke="#EF9F27" stroke-width="1" stroke-linecap="round" transform="rotate(-6 35 37)"/>

  <!-- Lignes d'envol -->
  <path d="M 54 24 Q 62 20 60 13" fill="none" stroke="#EF9F27" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 54 32 Q 64 28 64 20" fill="none" stroke="#EF9F27" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 52 40 Q 64 38 66 30" fill="none" stroke="#EF9F27" stroke-width="1" stroke-linecap="round" opacity="0.7"/>

  <!-- Point décoratif bas -->
  <circle cx="40" cy="66" r="3" fill="#BA7517"/>
  <line x1="20" y1="66" x2="34" y2="66" stroke="#EF9F27" stroke-width="0.8"/>
  <line x1="46" y1="66" x2="60" y2="66" stroke="#EF9F27" stroke-width="0.8"/>
</svg>
